
name: Daily Word Wallpaper Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q DailyWordWallpaper-source.zip

      - name: Fix wallpaper description
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path("DailyWordWallpaper/app/src/main/res")

          xml = base / "xml/wallpaper.xml"
          content = xml.read_text()
          content = content.replace(
              'android:description="Scripture-inspired wallpapers that refresh throughout your day"',
              'android:description="@string/wallpaper_description"'
          )
          xml.write_text(content)

          strings = base / "values/strings.xml"
          content = strings.read_text()
          content = content.replace(
              '</resources>',
              '    <string name="wallpaper_description">Scripture-inspired wallpapers that refresh throughout your day</string>\n</resources>'
          )
          strings.write_text(content)
          PY

      - name: Build APK
        working-directory: DailyWordWallpaper
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyWordWallpaper-APK
          path: DailyWordWallpaper/app/build/outputs/apk/debug/app-debug.apk
